name: Run Android Appium tests on GitHub Runner
on: push

jobs:
  run-mobile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node.js and Appium
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs npm
          npm install -g appium
          appium -v
          # Install the UiAutomator2 driver
          appium driver install uiautomator2
          # Verify driver installation
          appium driver list --installed

      - name: Enable KVM (for better emulator performance)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            echo "Waiting for emulator to boot..."
            adb wait-for-device
            adb shell getprop sys.boot_completed
            # Wait additional time to ensure fully booted
            sleep 30
            # Start Appium in the background
            appium &>/dev/null &
            sleep 10
            # Verify Appium is running
            curl -sSf http://localhost:4723/status || (echo "Appium failed to start" && exit 1)
            # Run tests with timeout
            timeout 300 mvn clean test || echo "Tests completed or timed out"
            # Cleanup processes
            pkill -f appium || true
            pkill -f java || true