name: Run Android Appium tests on GitHub Runner
on: push

jobs:
  run-mobile-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node.js and Appium
        run: |
          brew install node
          npm install -g appium
          appium -v

      - name: Run Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: arm64-v8a
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel off
          script: |
            echo "Waiting for emulator to boot..."
            adb wait-for-device
            adb shell getprop sys.boot_completed
            # Wait additional time to ensure fully booted
            sleep 30
            # Start Appium in the background
            appium &>/dev/null &
            sleep 10
            # Run tests
            mvn clean test