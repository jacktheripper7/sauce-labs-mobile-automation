name: Run Android Appium tests on GitHub Runner
on: push

jobs:
  run-mobile-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node.js and Appium
        run: |
          brew install node
          npm install -g appium
          appium -v
          # Start Appium in the background
          appium &>/dev/null &

      - name: Run Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          force-avd-creation: true
          script: |
            echo "Waiting for emulator to boot..."
            adb wait-for-device
            # Optional: wait additional time to ensure fully booted
            sleep 30
            mvn clean test
